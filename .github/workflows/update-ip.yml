name: Aggregate IP Blocklists

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  id-token: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and Aggregate IPs
        run: python3 update_ip.py

      - name: Generate Checksums & Tag
        id: meta
        run: |
          sha256sum public/ips.txt > public/ips.txt.sha256
          TAG_NAME="blocklist-$(date -u +'%Y.%m.%d-%H%M')"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG_NAME"

      - name: Commit and Push Generated File back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/ips.txt
          git diff --staged --quiet || git commit -m "Auto-update aggregated IP blocklist [skip ci]"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG_NAME }}
          name: "IP Blocklist Release ${{ steps.meta.outputs.TAG_NAME }}"
          body: "Automated aggregated malicious IP blocklist with SHA256 checksum."
          files: |
            public/ips.txt
            public/ips.txt.sha256

      - name: Prune old releases (keep last 30)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=30
          gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | tail -n +$((KEEP+1)) \
            | while read -r tag; do
                echo "Удаляю релиз $tag"
                gh release delete "$tag" --yes --cleanup-tag || true
              done
            
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


